name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  spec-current:
    name: Spec is the latest release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: scripts/spec-current.sh

  vectors-linux:
    name: Spec vectors (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4.3-noble
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: swift test

  vectors-macos:
    name: Spec vectors (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: swift test
